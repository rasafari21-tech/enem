<style>
/* Layout: a single phone column, a sticky day header, a bottom tab bar; days wear the pastel of the paper planner. */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --ink: #1F1E24; --muted: #5E5A63; --line: #E2DDD5;
  --accent: #3B4BC8; --ok: #2F7D3A; --okbg: #E3F2DF; --off: #2E2D3D; --offfg: #FFFFFF; --on: #CDEBC3; --onfg: #173A12;
  --warnbg: #FEF1D2; --decide: #E6F4DF;
  --d0: #F2C4DD; --d1: #FCE8A8; --d2: #F8B3B0; --d3: #D5C8F3; --d4: #C2DAF4; --d5: #BEE2AC; --d6: #A9DED4;
  --s0: #FBEAF3; --s1: #FEF7DE; --s2: #FDE6E5; --s3: #F1ECFC; --s4: #EAF2FC; --s5: #EDF7E7; --s6: #E8F6F2;
  --dayink: #1F1E24;
  --display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}

  --bg: #16151B; --surface: #201F27; --ink: #F1EEF4; --muted: #ABA6B3; --line: #34323D;
  --accent: #9FAEFF; --ok: #8FD69A; --okbg: #1E3321; --off: #E9E7F2; --offfg: #1A1920; --on: #2F5A27; --onfg: #E3F7DC;
  --warnbg: #3A3220; --decide: #22331E;
  --s0: #33222C; --s1: #332E1E; --s2: #362224; --s3: #2A2638; --s4: #1F2A36; --s5: #22301F; --s6: #1D302C;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16151B; --surface: #201F27; --ink: #F1EEF4; --muted: #ABA6B3; --line: #34323D;
  --accent: #9FAEFF; --ok: #8FD69A; --okbg: #1E3321; --off: #E9E7F2; --offfg: #1A1920; --on: #2F5A27; --onfg: #E3F7DC;
  --warnbg: #3A3220; --decide: #22331E;
  --s0: #33222C; --s1: #332E1E; --s2: #362224; --s3: #2A2638; --s4: #1F2A36; --s5: #22301F; --s6: #1D302C;
  color-scheme: dark }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
main { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.1; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 800; margin: 1.4rem 0 .6rem; }
h3 { font-size: 1.05rem; font-weight: 700; margin: 1rem 0 .4rem; }
p { margin: 0 0 .7rem; }
a { color: var(--accent); }
.small { font-size: .85rem; color: var(--muted); }
button { font: inherit; color: inherit; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: .7rem 0 .6rem; border-bottom: 1px solid var(--line); }
.top .row { display: flex; align-items: center; gap: .5rem; }
.hdr-icon { width: 16px; height: 16px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; display: inline-block; object-fit: cover; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.navbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; font-size: 1.1rem; }
.navbtn.wide { padding: 0 .9rem; font-size: .9rem; font-weight: 700; }
.grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
.chip { font-size: .78rem; font-weight: 700; border-radius: 999px; padding: .15rem .6rem; background: var(--surface); border: 1px solid var(--line); }
.progressbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: .55rem; }
.progressbar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
/* day card */
.day { border: 1.5px solid #8A857C; border-radius: 14px; overflow: hidden; margin: .9rem 0; background: var(--surface); }
.dh { display: flex; justify-content: space-between; align-items: baseline; padding: .55rem .85rem; color: var(--dayink); font-weight: 800; letter-spacing: .2em; font-size: .82rem; text-transform: uppercase; border-bottom: 1.5px solid #8A857C; }
.dh span { letter-spacing: 0; font-weight: 700; font-size: .85rem; text-transform: none; }
.blk { padding: .8rem .85rem; border-bottom: 1px solid var(--line); }
.blk:last-child { border-bottom: none; }
.bh { display: flex; gap: .7rem; align-items: flex-start; }
.check { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--muted); background: var(--surface); cursor: pointer; display: grid; place-items: center; margin-top: .1rem; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check svg { width: 18px; height: 18px; opacity: 0; }
.check[aria-pressed="true"] svg { opacity: 1; }
.meta { font-size: .8rem; color: var(--muted); }
.meta b { color: var(--ink); }
.tema { font-weight: 700; font-size: 1.04rem; line-height: 1.3; margin: .15rem 0; }
.copy { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .25rem .7rem; font-size: .8rem; font-weight: 700; cursor: pointer; margin-top: .35rem; }
.sub { font-size: .86rem; margin-top: .25rem; }
.done .tema { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
details.steps { margin-top: .55rem; border-top: 1px dashed var(--line); padding-top: .45rem; }
details.steps summary { cursor: pointer; font-weight: 700; font-size: .88rem; color: var(--accent); }
.step { display: grid; grid-template-columns: 4.6rem 1fr; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.step:last-child { border-bottom: none; }
.step.now { background: var(--okbg); border-radius: 8px; padding-inline: .4rem; }
.tm { font-family: var(--mono); font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.wifi { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .05em; border-radius: 5px; padding: .05rem .35rem; margin-top: .2rem; }
.wifi.off { background: var(--off); color: var(--offfg); } .wifi.on { background: var(--on); color: var(--onfg); }
.step .det { font-size: .78rem; color: var(--muted); margin-top: .2rem; }
.prep { display: flex; gap: .7rem; padding: .7rem .85rem; background: var(--bg); border-top: 1px dashed var(--line); font-size: .88rem; }
.prep b { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; display: block; }
.note { padding: .8rem .85rem; }
.box { border-radius: 12px; padding: .8rem .9rem; margin: .8rem 0; background: var(--surface); border: 1px solid var(--line); }
.box.warn { background: var(--warnbg); border-color: transparent; }
.box.decide { background: var(--decide); border-color: transparent; }
.hito { background: var(--warnbg); border-radius: 12px; padding: .65rem .85rem; font-size: .9rem; margin: .7rem 0; }
.spiral { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .85rem; font-size: .86rem; margin: .7rem 0; }
.now-banner { border-radius: 12px; background: var(--accent); color: var(--bg); padding: .7rem .85rem; margin: .7rem 0; font-weight: 700; }
.now-banner small { display: block; font-weight: 400; opacity: .9; }
/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs a { text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 700; text-align: center; padding: .55rem 0 .5rem; display: grid; gap: .15rem; justify-items: center; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a[aria-current="page"] { color: var(--accent); }
/* lists */
.list a.item, .list button.item { display: flex; justify-content: space-between; gap: .6rem; align-items: center; width: 100%; text-align: left; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .75rem .85rem; margin-bottom: .5rem; cursor: pointer; }
.weekgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: .45rem; }
.weekgrid button { border: none; border-radius: 10px; padding: .5rem; text-align: left; cursor: pointer; color: var(--dayink); font-size: .78rem; line-height: 1.2; }
.weekgrid button b { font-family: var(--display); font-size: 1.05rem; display: block; }
.weekgrid button.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { border: 1px solid var(--line); padding: .4rem .45rem; text-align: left; vertical-align: top; }
th { background: var(--bg); }
pre.code { white-space: pre-wrap; font-family: var(--mono); font-size: .8rem; line-height: 1.45; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .7rem; margin: .5rem 0; }
.stage { border-radius: 12px; padding: .7rem .85rem; margin-bottom: .6rem; }
.stage.s0 { background: var(--s0); } .stage.s1 { background: var(--s1); } .stage.s2 { background: var(--s5); }
.stage.s3 { background: var(--s4); } .stage.s4 { background: var(--s3); } .stage.s5 { background: var(--s2); }
.term { border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: .6rem; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .6rem 0; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .55rem; text-align: center; font-size: .78rem; color: var(--muted); }
.kpi span { display: block; font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi.hi { background: var(--d1); color: var(--dayink); } .kpi.hi span { color: var(--dayink); }
label.f { display: block; font-size: .85rem; font-weight: 700; margin: .55rem 0 .2rem; }
input.f, textarea.f { width: 100%; font: inherit; font-size: 16px; padding: .55rem .65rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea.f { min-height: 4.5rem; }
.btn { border: none; background: var(--accent); color: var(--bg); font-weight: 700; border-radius: 999px; padding: .65rem 1.1rem; cursor: pointer; margin-top: .7rem; }
.sync { font-size: .75rem; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

ão 1 e a 2: anote no Notas o que melhorou.", "Notas", "1–3 linhas de melhorias", "Escritas."], ["18:25", "18:45", true, "8 questões do ENEM do seu tema mais fraco da semana (o que mais aparece no caderno), com o Prompt B.", "Navegador + Prompt B", "% de acerto", "Anotado."], ["18:45", "19:00", true, "Registro semanal + preparar a segunda-feira 12:00.", "Notas", "Registro em dia + material de segunda", "Teste no modo avião."]]}, "P8": {"name": "Correção de simulado ou de controle", "when": "12:00–13:30", "steps": [["12:00", "12:30", false, "Com os prints dos gabaritos, classifique cada erro: conteúdo, leitura, cálculo, tempo ou distrator. Marque os «seguro mas errei».", "Caderno + prints", "Lista de erros classificados", "Cada erro tem seu tipo."], ["12:30", "13:15", true, "Prompt B com os 5–8 erros mais fáceis (os que a TRI mais pune) e refaça sem olhar.", "Prompt B", "Erros entendidos", "Refeitos sem ajuda."], ["13:15", "13:30", true, "Passe tudo para o caderno e prepare a tarde.", "Notas, Fotos", "Material salvo", "Teste no modo avião."]]}, "PL": {"name": "Dia leve", "when": "12:00–12:30", "steps": [["12:00", "12:30", false, "Só cartões e o que o dia indicar. Nada novo.", "Notas", "Cartões em dia", "Feito."]]}}, "templateOrder": ["P1", "P0", "P9", "P2", "P3", "P4", "P5", "P6a", "P6b", "P7", "P7t", "P7b", "P8", "PL"], "semanaTipo": "\n<div class=\"tw\"><table>\n<tr><th>Dia<\/th><th>12:00–13:30 (B1)<\/th><th>17:30–19:00 (B2)<\/th><\/tr>\n<tr><td style=\"background:var(--d0)\">Seg<\/td><td>Matemática (P1)<\/td><td>Biologia (P2)<\/td><\/tr>\n<tr><td style=\"background:var(--d1)\">Ter<\/td><td>Física (P1)<\/td><td>Linguagens (P3)<\/td><\/tr>\n<tr><td style=\"background:var(--d2)\">Qua<\/td><td>Química (P1)<\/td><td>Humanas ou Literatura/Artes (P2)<\/td><\/tr>\n<tr><td style=\"background:var(--d3)\">Qui<\/td><td>Matemática (P1)<\/td><td>Linguagens, Biologia ou Humanas, alternando (P3/P2)<\/td><\/tr>\n<tr><td style=\"background:var(--d4)\">Sex<\/td><td>Física ou Química (P1)<\/td><td>Humanas ou Literatura/Artes (P2)<\/td><\/tr>\n<tr><td style=\"background:var(--d5)\">Sáb<\/td><td>Prova de área, questões 1–30 (P6a) <i>ou<\/i> redação (P7)<\/td><td>Questões 31–45 + correção (P6b) <i>ou<\/i> reescrita (P7b)<\/td><\/tr>\n<tr><td style=\"background:var(--d6)\">Dom<\/td><td colspan=\"2\">Livre<\/td><\/tr>\n<\/table><\/div>\n<p class=\"small\">Semanas de consolidação (a cada 3 semanas de conteúdo): listas mistas, caderno de erros e um minimódulo. Semanas de controle: um ENEM inteiro por áreas (segunda a sábado).<\/p>\n<div class=\"box\"><b>Cartões: que caixa revisar em cada dia<\/b><br>Caixa 1: todos os dias · Caixa 2: segunda e quinta · Caixa 3: sábado · Caixa 4: semanas de consolidação.<\/div>\n", "prompts": [["A", "Aula curta (12:30–12:55)", "Você é meu professor para o ENEM. Tema: [COLE AQUI O TEMA DO DIA, o texto entre «» do app].\nMeu nível: estudante hispanofalante no Brasil, 2º ano do Ensino Médio; no ENEM 2023 acertei Mat 21/44 e Natureza 14/45.\nAcabei de fazer este pré-teste com questões reais do ENEM:\n[COLE AS QUESTÕES + MINHAS RESPOSTAS + O GABARITO OFICIAL]\nRegras:\n1. Comece dizendo em 3 linhas que conceitos me faltam, segundo meus erros.\n2. Explique o tema em no máximo 600 palavras, em português simples, com um minivocabulário espanhol→português de 5 termos-chave, focando em COMO o ENEM cobra este tema.\n3. Dê 2 exemplos resolvidos passo a passo. Depois de cada passo importante, pergunte «por quê?» e ESPERE minha resposta antes de seguir.\n4. Depois dê 1 exemplo incompleto para eu terminar e me corrija.\n5. Não me dê a resposta de um exercício que eu não tenha tentado.\n6. Não invente dados, fórmulas nem fontes. Se não tiver certeza de algo, diga e marque como «verificar»."], ["B", "Tutor de prática (corrigir e praticar)", "Vou colar questões reais do ENEM sobre [TEMA DO DIA] com o GABARITO OFICIAL no final.\nUse o gabarito oficial como verdade. Não me revele o gabarito.\nPara cada questão:\n1. Espere minha resposta e minha confiança (S seguro / D dúvida / C chute).\n2. Se eu acertar: peça em 1 frase por que está correta.\n3. Se eu errar: não me dê a resposta. Dê 1 dica; se eu errar de novo, 1 segunda dica; depois explique de forma simples usando o gabarito.\n4. Classifique meu erro: conteúdo / leitura / cálculo / tempo / distrator.\nSe eu errar mais da metade das 5 primeiras, PARE e me dê 1 exemplo resolvido antes de seguir.\nNo final, me dê uma tabela curta para o meu caderno de erros (questão | tema | tipo de erro | raciocínio correto em 1 frase) e 3 cartões no formato «P: … → R: …».\nSe você não souber algo ou o enunciado estiver incompleto, diga; não invente."], ["C", "Correção de redação (foto)", "Corrija esta redação do ENEM (foto anexa) pelas 5 competências da Cartilha do Participante.\nTema: [ESCREVA O TEMA]. Sou hispanofalante. Não reescreva meu texto.\nC1: liste cada desvio e marque quais são interferência do espanhol.\nC2: o repertório é legitimado, pertinente e produtivo? Que dado devo verificar? Não invente dados.\nC3: há tese clara e progressão? Alguma contradição?\nC4: conectivos entre parágrafos e repetições.\nC5: identifique agente, ação, meio/modo, finalidade e detalhamento; diga qual falta.\nDê uma nota estimada por competência com uma faixa (diga que é estimativa) e as 3 correções de maior impacto.\nSe não conseguir ler alguma parte da foto, diga em vez de adivinhar."], ["D", "Ficha para estudar sem wifi (13:15–13:30)", "Prepare uma FICHA para eu estudar sem internet sobre: [TEMA DA TARDE].\nMeu nível: estudante do 2º ano, hispanofalante, preparando o ENEM.\nFormato (no máximo 350 palavras, texto simples para copiar no Notas):\n1. 5 ideias-chave em frases curtas (em português, com a palavra em espanhol entre parênteses se for difícil).\n2. 1 esquema ou fórmula principal, se houver.\n3. Como o ENEM costuma cobrar isso (2 padrões típicos).\n4. 3 erros comuns.\n5. 4 perguntas de autoavaliação SEM respostas.\n6. As respostas dessas 4 perguntas, no final, com o título «RESPOSTAS».\nNão invente números nem fontes; se um dado pode mudar, escreva «verificar»."], ["E", "«Não entendi»", "Não entendi [TEMA OU PASSO ESPECÍFICO]. O que eu entendi é: [ESCREVA COM SUAS PALAVRAS].\nExplique de outro jeito, em português simples, com uma analogia do dia a dia e um exemplo numérico bem fácil.\nDepois me faça 2 perguntas fáceis, espere minhas respostas e me corrija.\nNão me dê a resposta antes de eu tentar. Se não tiver certeza de algo, diga."], ["F", "Análise de uma prova de área (18:25–18:45)", "Fiz a prova de [ÁREA] do [ENEM ANO]. Acertei [N]/45.\nEstas são as questões que errei, com minha confiança e o tipo de erro que acho que tive:\n[LISTA: número · S/D/C · tema]\n1. Agrupe meus erros por tema e por tipo.\n2. Diga quais provavelmente eram fáceis (as que a TRI mais pune) e por quais começar.\n3. Proponha 3 temas para minhas próximas revisões.\nNão invente dados sobre a prova; se não conhecer uma questão, peça que eu cole."]], "sections": [["meta", "Meta e ponto de partida", "\n<p><b>Meta:<\/b> Ciência da Computação na UDESC (Joinville) pelo SISU, com a cota de escola pública. A UDESC dá o mesmo peso às 5 notas: sua nota = (Redação + Linguagens + Humanas + Natureza + Matemática) ÷ 5.<\/p>\n<div class=\"kpis\"><div class=\"kpi\"><span>~580<\/span>hoje (estimado)<\/div><div class=\"kpi hi\"><span>720<\/span>meta (cota)<\/div><div class=\"kpi\"><span>740<\/span>meta alta<\/div><\/div>\n<p class=\"small\">A cota de escola pública cortou em ~701–706 e a ampla concorrência em 725–740 (SISU 2023–2026). Confirme com a escola que todo o seu Ensino Médio conta como escola pública.<\/p>\n<p><b>Data:<\/b> ENEM 2027, estimado para os domingos 07/11 e 14/11/2027 (o INEP ainda não publicou o edital; confira quando sair, por volta de maio).<\/p>\n<p><b>Onde você está:<\/b> ENEM 2023 feito em partes: Linguagens 30/45, Humanas 28/45, Natureza 14/45, Matemática 21/44. Redação estimada entre 360 e 600, sobretudo por interferência do espanhol e proposta de intervenção incompleta.<\/p>\n<p><b>O que mais sobe a sua média:<\/b> redação (de 600 para 900 = +60 pontos na média), Natureza (você está quase no chute: muito a ganhar) e Matemática (~13 pontos por acerto a mais).<\/p>\n<div class=\"box warn\"><b>Sem promessas.<\/b> Ninguém pode garantir a nota. Contam a constância, o sono, a dificuldade da prova e a nota de corte do ano. Os controles de fevereiro, abril, junho, agosto e outubro mostram se você está no caminho.<\/div>\n"], ["estrategia", "A estratégia em linguagem simples", "\n<h3>O que estudamos e em que ordem<\/h3>\n<ol>\n<li><b>Primeiro a base<\/b> (Fase 0, 3 semanas): potências de 10 e log, funções como gráfico e trigonometria com vetores. Sem isso, Física e Química ficam pela metade.<\/li>\n<li><b>Depois o que mais cai<\/b>: proporção, porcentagem, escala, gráficos e estatística; ecologia; energia e eletricidade (kWh, circuitos); calorimetria; química ambiental e estequiometria; Brasil Colônia, Império e República; espaço agrário e urbano; interpretação de textos.<\/li>\n<li><b>Por fim, o que cai menos<\/b>, em versão curta. No fim, tudo volta em revisões por incidência e simulados.<\/li>\n<\/ol>\n<p><b>Por que essa ordem:<\/b> o ENEM repete os mesmos tipos de questão («padrões»). Começar pelos mais repetidos rende pontos antes, e respeitar os pré-requisitos evita o «entendi pouco».<\/p>\n<h3>Como o tempo se divide<\/h3>\n<ul>\n<li><b>Meio-dia (B1):<\/b> tema novo de Matemática, Física ou Química. Primeiro você tenta (pré-teste), depois a IA explica, depois você pratica.<\/li>\n<li><b>Tarde (B2):<\/b> cartões + espiral (temas de 1, 4 e 12 semanas atrás) + uma matéria de leitura ou uma lista de Linguagens.<\/li>\n<li><b>Sábado:<\/b> os mesmos horários. Uma semana: prova de uma área (45 questões em duas partes). Na outra: redação + reescrita.<\/li>\n<li><b>A cada 3 semanas:<\/b> semana de consolidação, sem temas novos: listas misturadas e caderno de erros.<\/li>\n<li><b>Domingo:<\/b> livre.<\/li>\n<\/ul>\n<p>Regra de ouro: <b>dois de cada três minutos respondendo questões<\/b>. A prática com testes e a revisão espaçada são as técnicas mais úteis; reler e resumir, as menos (Dunlosky et al., 2013).<\/p>\n<h3>Como saber se está avançando<\/h3>\n<ul><li>Cada bloco: porcentagem de acerto na prática (meta ≥85 % no tema recém-visto).<\/li><li>Cada sábado: registro semanal no app (aba Progresso).<\/li><li>Controles: ENEM completo por áreas em fevereiro, abril, junho, agosto e outubro de 2027.<\/li><\/ul>\n<h3>Se atrasar, cansar ou não entender<\/h3>\n<p>Nunca dobre blocos. Primeiro corte a espiral, depois a matéria de leitura do dia; o tema perdido entra na próxima consolidação. Se não entender, use o Prompt E e volte para exemplos resolvidos. Detalhes em «Plano B».<\/p>\n"], ["etapas", "Cronograma por etapas", "\n<div class=\"stage s0\"><h3>Fase 0 · Revisão e base · 28/10 – 15/11/2026 (S1–S3)<\/h3>\n<p><b>Temas:<\/b> revisão com questões das antigas semanas S1–S6 do seu cronograma anterior (operações, equações, razão, cinemática, Newton, átomos, ligações, forças intermoleculares, bioquímica, célula, Antiguidade, Idade Média, cartografia, clássicos da Sociologia) + pré-requisitos (potências de 10 e log, funções como gráfico, trigonometria e vetores).<\/p>\n<p><b>No fim você saberá:<\/b> converter unidades e notação científica, ler um gráfico s×t, decompor um vetor e usar seno/cosseno.<\/p>\n<p><b>Para avançar:<\/b> ≥70 % na prática de trigonometria e funções. Se não, repita esses dois temas no primeiro bloco livre da Fase 1.<\/p><\/div>\n<div class=\"stage s1\"><h3>Fase 1 · Bloco A · 16/11/2026 – 03/01/2027 (S4–S10)<\/h3>\n<p><b>Temas:<\/b> regra de três, escala, porcentagem, gráficos, estatística; energia, calorimetria, eletricidade básica e kWh; separação de misturas, tratamento de água, química ambiental, ácidos/bases/pH; organelas, fotossíntese, respiração, ecologia; Iluminismo, colonização, espaço agrário, clima.<\/p>\n<p><b>Simulados:<\/b> ENEM 2026 por áreas nos sábados de 21/11 a 12/12 = a sua linha de base real. Consolidação na S7. Natal (S9) leve.<\/p>\n<p><b>Para avançar:<\/b> na consolidação, ≥65 % na lista mista de Matemática.<\/p><\/div>\n<div class=\"stage s2\"><h3>Fase 2 · Férias · 04/01 – 21/02/2027 (S11–S17)<\/h3>\n<p><b>Temas:<\/b> regra de três composta, unidades, juros, funções, áreas, semelhança, Pitágoras; ondas, acústica, hidrostática, impulso, resistores, circuitos; estequiometria, soluções, cinética, equilíbrio, termoquímica, pilhas; ciclos, desequilíbrios, biomas, vírus, bactérias; Brasil Colônia, Revolução Francesa, independências, urbano.<\/p>\n<p><b>Para avançar:<\/b> ≥60 % nas listas de Natureza da S17.<\/p><\/div>\n<div class=\"stage s3\"><h3>Fase 3a · Bloco B · 22/02 – 30/05/2027 (S18–S31)<\/h3>\n<p><b>Temas:<\/b> círculo, probabilidade, sólidos e volumes, exponencial e log, combinatória; óptica, termodinâmica, eletrostática, magnetismo, indução; orgânica completa, polímeros, biodiesel; parasitoses, imunidade, biotecnologia, evolução, fisiologia; Império, República, Vargas, Ditadura; geopolítica, energia, globalização.<\/p>\n<p><b>Controles:<\/b> fevereiro (S18, ENEM 2014) e abril (S26, ENEM 2016), por áreas durante a semana.<\/p><\/div>\n<div class=\"stage s4\"><h3>Fase 3b · Bloco B · 31/05 – 29/08/2027 (S32–S44)<\/h3>\n<p><b>Temas:<\/b> o restante do conteúdo e, quando uma matéria termina, «revisão por incidência» dos temas mais cobrados.<\/p>\n<p><b>Controles:<\/b> junho (S35, ENEM 2018) e agosto (S44, ENEM 2021). Inscrição no ENEM 2027 (fim de maio–junho) e na UDESC (a partir de ~23/08).<\/p><\/div>\n<div class=\"stage s5\"><h3>Fase 4 · Revisão final · 30/08 – 07/11/2027 (S45–S54)<\/h3>\n<p><b>Cada semana:<\/b> 2 áreas de um ENEM recente (quarta e sábado), 2 redações, correção na segunda e revisão por incidência. A cada 2 semanas você completa um ENEM inteiro.<\/p>\n<p><b>Nada fica de fora:<\/b> os 17 temas que não couberam antes (Zoologia, Histologia, Fungos, Segunda Guerra, Imperialismo, Kant e Hegel, Parnasianismo…) entram entre S45 e S52, um por bloco de revisão, como «Tema novo (reta final)», antes da revisão por incidência.<\/p>\n<p><b>Última semana:<\/b> nada novo, sono e logística. Domingo 07/11: ENEM.<\/p><\/div>\n"], ["controles", "Controles e metas", "\n<p>Meta de acertos (de 45) em cada controle. Estimativa com as medianas TRI de 2025 (XTRI): é um guia, não uma conversão exata.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Controle<\/th><th>Ling<\/th><th>Hum<\/th><th>Nat<\/th><th>Mat<\/th><th>Red.<\/th><th>Média<\/th><\/tr>\n<tr><td>dez/2026 (ENEM 2026)<\/td><td colspan=\"6\">linha de base: anote o que tirar<\/td><\/tr>\n<tr><td>fev/2027<\/td><td>32<\/td><td>30<\/td><td>19<\/td><td>23<\/td><td>640<\/td><td>~625<\/td><\/tr>\n<tr><td>abr/2027<\/td><td>33<\/td><td>32<\/td><td>22<\/td><td>25<\/td><td>700<\/td><td>~655<\/td><\/tr>\n<tr><td>jun/2027<\/td><td>34<\/td><td>33<\/td><td>24<\/td><td>27<\/td><td>760<\/td><td>~680<\/td><\/tr>\n<tr><td>ago/2027<\/td><td>35<\/td><td>34<\/td><td>26<\/td><td>28<\/td><td>820<\/td><td>~700<\/td><\/tr>\n<tr><td>out/2027<\/td><td>35–37<\/td><td>35–36<\/td><td>28–30<\/td><td>29–31<\/td><td>880+<\/td><td><b>~720–740<\/b><\/td><\/tr>\n<\/table><\/div>\n<p class=\"small\">Se dois controles seguidos ficarem mais de 20 pontos abaixo da meta, mude quais áreas prioriza, não o método.<\/p>\n"], ["offline", "Como deixar tudo pronto para os trechos sem wifi", "\n<div class=\"box warn\"><b>Regra:<\/b> entre 12:00–12:30 e 17:30–18:25 você não abre nada que precise de internet. O que vai usar nesses trechos você salva antes, no trecho com wifi anterior.<\/div>\n<div class=\"tw\"><table><tr><th>Quando salvar<\/th><th>Para<\/th><\/tr>\n<tr><td><b>13:15–13:30<\/b> (com wifi)<\/td><td>a tarde de hoje (17:30–18:25)<\/td><\/tr>\n<tr><td><b>18:45–19:00<\/b> (com wifi)<\/td><td>amanhã 12:00–12:30<\/td><\/tr>\n<tr><td><b>sábado 18:45–19:00<\/b><\/td><td>segunda 12:00<\/td><\/tr><\/table><\/div>\n<p>Cada dia do app mostra exatamente <b>o que<\/b> salvar em duas linhas: «Salvar para a tarde» e «Salvar para amanhã».<\/p>\n<h3>As 4 ferramentas (grátis, já estão no iPhone)<\/h3>\n<ol>\n<li><b>Fotos → álbum «ENEM offline».<\/b> Para questões: print da tela (botão lateral + aumentar volume). Faça print da questão e, separado, do gabarito; deixe o gabarito no fim do álbum para não ver sem querer. Depois de usar, apague os prints.<\/li>\n<li><b>Notas → pasta «ENEM».<\/b> Ali ficam: «Fichas» (resumos que a IA prepara com o Prompt D), «Caixa 1…Caixa 4» (cartões), «Erros de espanhol» e as correções de redação. O Notas funciona sem internet.<\/li>\n<li><b>Arquivos → «No meu iPhone» → pasta «ENEM».<\/b> Só para o PDF do caderno da prova da semana: abra no Safari pela página do INEP → Compartilhar → «Salvar em Arquivos». <b>Um PDF por vez<\/b>; apague quando fizer as duas áreas desse caderno.<\/li>\n<li><b>Safari → Lista de Leitura<\/b> (plano B para uma página): Compartilhar → «Adicionar à Lista de Leitura». Ative em Ajustes → Safari → «Salvar Automaticamente Offline».<\/li>\n<\/ol>\n<h3>Este app sem internet<\/h3>\n<p>Abra o app no trecho com wifi e <b>não feche a aba<\/b>: o dia continua na tela. As caixinhas que marcar sem internet ficam guardadas no celular e sincronizam quando o wifi voltar. Para garantir, o PDF «Plan ENEM 2027 movil» continua sendo a cópia offline completa.<\/p>\n<h3>Teste de 10 segundos<\/h3>\n<p>Antes de fechar um trecho com wifi: ative o <b>modo avião<\/b>, abra a ficha e um print. Se abrirem, desative. Se não, salve de novo.<\/p>\n<h3>Se algo falhar<\/h3>\n<ul>\n<li><b>O PDF não baixa:<\/b> faça print das primeiras 10 questões da área e do gabarito; no trecho sem wifi resolva essas 10 e troque o resto do bloco por caderno de erros (P5).<\/li>\n<li><b>Esqueceu de salvar:<\/b> o trecho sem wifi vira P5 (caderno de erros + cartões). A tarefa do dia passa para o trecho com wifi.<\/li>\n<li><b>Pouca memória:<\/b> apague os prints usados todo sábado.<\/li>\n<\/ul>\n<h3>Onde achar questões (no trecho com wifi)<\/h3>\n<ul><li>Provas e gabaritos oficiais: página «Provas e gabaritos» do INEP.<\/li><li>Por tema: pesquise <i>«questões enem [TEMA] com gabarito»<\/i> e prefira páginas que mostram o ano do ENEM.<\/li><li>App gratuito MEC Enem: simulados e correção de redação por foto.<\/li><\/ul>\n"], ["tecnicas", "Técnicas explicadas passo a passo", "\n<div class=\"term\"><h3>Recuperação ativa (lembrar sem olhar)<\/h3><p><b>O que é:<\/b> tirar a informação da memória em vez de reler. Lembrar fortalece a memória mais do que reler.<\/p><p><b>No celular:<\/b> feche a ficha e escreva no caderno o que lembra; depois compare.<\/p><p><b>Exemplo:<\/b> «O que é eutrofização?» → excesso de nutrientes → algas → cai o oxigênio → peixes morrem.<\/p><p><b>Quando:<\/b> 12:00–12:05 e 18:00–18:25 (sem wifi). <b>Evite:<\/b> espiar a ficha «só um segundo».<\/p><\/div>\n<div class=\"term\"><h3>Revisão espaçada com «caixas» (cartões sem cartões)<\/h3><p><b>O que é:<\/b> revisar quando você está começando a esquecer, com intervalos cada vez maiores. Para uma prova daqui a um ano, a revisão principal funciona melhor a cada 3–4 semanas (Cepeda 2008).<\/p><p><b>No celular (grátis, sem wifi):<\/b> no Notas, crie 4 notas: <b>Caixa 1<\/b> (todo dia), <b>Caixa 2<\/b> (segunda e quinta), <b>Caixa 3<\/b> (sábado), <b>Caixa 4<\/b> (semanas de consolidação). Cada cartão é uma linha: <i>P: pergunta → R: resposta<\/i>. Tape a R com o polegar, responda, confira. Acertou → recorte a linha e cole na caixa seguinte. Errou → volta para a Caixa 1.<\/p><p><b>Exemplo:<\/b> «P: chuveiro no inverno: mais ou menos resistência? → R: menos R ⇒ mais potência (P = U²/R)».<\/p><p><b>Quanto:<\/b> 10–15 min no início de um trecho sem wifi. <b>Evite:<\/b> cartões longos (uma ideia por cartão).<\/p><\/div>\n<div class=\"term\"><h3>Pré-teste (tentar antes da explicação)<\/h3><p><b>O que é:<\/b> responder questões do tema antes de estudar. Ajuda se a explicação vier logo depois (Sinha e Kapur, 2021).<\/p><p><b>Quando:<\/b> 12:05–12:20. <b>Evite:<\/b> desanimar: errar o pré-teste é normal e útil.<\/p><\/div>\n<div class=\"term\"><h3>Exemplo resolvido<\/h3><p>Uma solução passo a passo que você estuda explicando o porquê de cada passo. É o melhor quando o tema é novo. O Prompt A dá 2–3 exemplos e pergunta «por quê?» em cada passo. <b>Quando:<\/b> 12:30–12:55.<\/p><\/div>\n<div class=\"term\"><h3>Intercalação (misturar tipos de questão)<\/h3><p><b>O que é:<\/b> praticar questões de temas diferentes misturadas, para aprender a reconhecer qual técnica usar. Num estudo com 787 alunos, misturar deu 61 % contra 38 % um mês depois (Rohrer et al.).<\/p><p><b>Como:<\/b> a espiral (17:45–18:00) e as listas mistas. <b>Evite:<\/b> misturar no dia em que vê o tema pela primeira vez.<\/p><\/div>\n<div class=\"term\"><h3>Gabarito e correção<\/h3><p>Conferir a resposta com a oficial e entender o erro. Sem correção, testar-se com menos de 50 % de acerto quase não ajuda. <b>Evite:<\/b> olhar o gabarito antes de responder.<\/p><\/div>\n<div class=\"term\"><h3>Calibração de confiança (S / D / C)<\/h3><p>Anotar quão seguro você está. Os erros marcados como S («seguro mas errei») são prioridade número um: são ideias erradas, não esquecimento.<\/p><\/div>\n<div class=\"term\"><h3>Caderno de erros<\/h3><p>No caderno de papel, uma linha por erro: <i>data · tema · tipo (conteúdo / leitura / cálculo / tempo / distrator) · raciocínio correto em 1 frase<\/i>. Guarde o print da questão num álbum «Erros». Refaça cada erro depois de ~7 e ~30 dias (blocos P5).<\/p><p><b>Exemplo:<\/b> «12/11 · porcentagem · distrator · +20 % e depois −20 % dá 0,96, não 1».<\/p><\/div>\n<div class=\"term\"><h3>Espiral (revisão acumulada)<\/h3><p>Voltar a temas de 1, 4 e 12 semanas atrás para que não se apaguem. Cada semana do app tem a linha «Espiral».<\/p><\/div>\n<div class=\"term\"><h3>Consolidação<\/h3><p>Uma semana sem temas novos, a cada 3 semanas: listas misturadas, erros e um minimódulo de um tema muito cobrado.<\/p><\/div>\n<div class=\"term\"><h3>Prova de área, simulado e controle<\/h3><p>Responder as 45 questões de uma área de um ENEM real, com tempo (~3 min por questão). Um <b>controle<\/b> é um ENEM inteiro por áreas numa semana. Como 5 horas seguidas não cabem no seu horário, cada área se divide: 30 questões ao meio-dia e 15 à tarde.<\/p><\/div>\n<div class=\"term\"><h3>TRI e coerência<\/h3><p>O ENEM pontua pela dificuldade de cada questão e pune acertar difíceis errando fáceis (em Matemática 2025, até ~130 pontos a menos com o mesmo número de acertos). Por isso: garanta as fáceis primeiro; responda todas (em branco conta como erro); chute no final.<\/p><\/div>\n"], ["redacao", "Redação: estrutura fixa e repertório", "\n<ol>\n<li><b>Introdução:<\/b> contexto com um repertório + <b>tese<\/b> afirmativa (sem perguntas) + anúncio dos 2 argumentos.<\/li>\n<li><b>Desenvolvimento 1:<\/b> ideia + repertório verificado (fonte, ano, número) + 2–3 frases ligando à tese.<\/li>\n<li><b>Desenvolvimento 2:<\/b> igual, começando com um conectivo («Além disso»).<\/li>\n<li><b>Conclusão:<\/b> «Portanto» + tese retomada + proposta com <b>5 elementos<\/b>: agente, ação, meio/modo, finalidade e detalhamento.<\/li>\n<\/ol>\n<p><b>Repertório verificado que você já tem:<\/b> 110.758 escolas do campo fechadas entre 2000 e 2024 (INEP, compilado pelo Fonec); Lei nº 15.100/2025 (restrição do celular nas escolas); agro = 23,2 % do PIB em 2024 (CEPEA/CNA); vegetação nativa de 76 % para 64,5 % do território entre 1985 e 2023 (MapBiomas); Carl Sagan, <i>O mundo assombrado pelos demônios<\/i>. <b>Não use:<\/b> a citação «de Dewey» (falsa) nem o filme «O segredo do desastre» (não existe).<\/p>\n<h3>Sua lista «Erros de espanhol» (copie no Notas)<\/h3>\n<pre class=\"code\">na cual → na qual / em que\nem a → na · a Brasil → o Brasil · um 25% → 25%\ne (verbo) → é · a (haver) → há\nponer fim → pôr fim · quemas → queimadas\ndeforestação → desmatamento\nconsecuencias → consequências\nvegetasão → vegetação · concientisacão → conscientização\nlaborales → trabalhistas · causante → causador\npra → para · oque → o que\nterritorio → território · midia → mídia · tambem → também\nja → já · sera → será · so → só<\/pre>\n<p class=\"small\">Uma vez por mês, peça a um professor da escola para corrigir uma redação: calibra S2 e S3. A nota da IA é só uma estimativa.<\/p>\n"], ["planob", "Plano B", "\n<div class=\"term\"><h3>Um dia não consigo estudar<\/h3><p>Tudo bem. No dia seguinte faça <b>só o daquele dia<\/b>. O tema perdido entra na próxima consolidação. Não dobre blocos.<\/p><\/div>\n<div class=\"term\"><h3>Atrasei vários dias<\/h3><ol><li>Pule para o dia de hoje no app.<\/li><li>Anote no registro os temas pulados.<\/li><li>Na próxima consolidação, o minimódulo vira o tema pulado mais cobrado.<\/li><li>Se atrasar mais de 2 semanas, corte temas «versão curta», nunca proporção, gráficos, ecologia, energia ou redação.<\/li><\/ol><\/div>\n<div class=\"term\"><h3>Não entendo uma explicação<\/h3><p>Prompt E. Se continuar sem entender, desça um nível: peça o pré-requisito (por exemplo, frações antes de porcentagem). Marque o tema no caderno e volte a ele na próxima espiral.<\/p><\/div>\n<div class=\"term\"><h3>Fui mal numa prática<\/h3><p>Menos de 60 %: não avance para questões mais difíceis. Peça 2 exemplos resolvidos e repita 5 questões do mesmo tipo no dia seguinte, na espiral.<\/p><\/div>\n<div class=\"term\"><h3>Pouco tempo ou pouca bateria<\/h3><p><b>Versão mínima de 30 minutos:<\/b> cartões (10 min) + 5 questões do tema do dia (15 min) + anotar erros (5 min). Bateria baixa: modo de pouca energia, brilho baixo e caderno de papel.<\/p><\/div>\n<div class=\"term\"><h3>Não tenho wifi quando deveria<\/h3><p>O bloco inteiro vira sem wifi: cartões + caderno de erros (P5) + questões já salvas. A parte com IA passa para o próximo trecho com wifi.<\/p><\/div>\n<div class=\"term\"><h3>Estou cansado ou dormindo mal<\/h3><p>Dormir pesa mais que 30 minutos a mais de estudo (8–10 h recomendadas na sua idade). Vários dias sem concentração: uma semana com a versão mínima à tarde. Nada de cafeína depois das 14:00. Celular em «Não Perturbe» durante os blocos.<\/p><\/div>\n"]], "padroes": "<p>Quando um tema traz um código, procure questões desse tipo. M = Matemática, F = Física, Q = Química, B = Biologia, H = Humanas, L = Linguagens.<\/p><div class=\"tw\"><table><tr><th>Código<\/th><th>O que a questão pede<\/th><\/tr><tr><td><b>M01<\/b><\/td><td>Escala de mapa/planta, incluindo escala de área = k²<\/td><\/tr><tr><td><b>M02<\/b><\/td><td>Cadeias de conversão de unidades (m³↔L, km/h↔m/s, cm²↔m²)<\/td><\/tr><tr><td><b>M03<\/b><\/td><td>Conta/consumo de energia: kWh = potência × tempo × preço<\/td><\/tr><tr><td><b>M04<\/b><\/td><td>Regra de três com grandezas inversas (operários × dias, receitas, produção)<\/td><\/tr><tr><td><b>M05<\/b><\/td><td>Porcentagens sucessivas (+20 % e −20 % ≠ 0) e pontos percentuais × %<\/td><\/tr><tr><td><b>M06<\/b><\/td><td>Juros compostos com tabela de (1+i)^n ou valor de log dado<\/td><\/tr><tr><td><b>M07<\/b><\/td><td>Média ponderada de notas e «que nota eu preciso»<\/td><\/tr><tr><td><b>M08<\/b><\/td><td>Mediana a partir de tabela de frequências<\/td><\/tr><tr><td><b>M09<\/b><\/td><td>Gráfico de barras/linhas com eixo truncado<\/td><\/tr><tr><td><b>M10<\/b><\/td><td>Gráfico de setores: ângulo = % × 360°<\/td><\/tr><tr><td><b>M11<\/b><\/td><td>Função afim a partir de dois pontos de uma tabela (custo fixo + variável)<\/td><\/tr><tr><td><b>M12<\/b><\/td><td>Vértice da quadrática (lucro ou altura máxima)<\/td><\/tr><tr><td><b>M13<\/b><\/td><td>Crescimento/decaimento exponencial (bactérias, depreciação, meia-vida)<\/td><\/tr><tr><td><b>M14<\/b><\/td><td>Volume de prisma/cilindro e subida do nível da água<\/td><\/tr><tr><td><b>M15<\/b><\/td><td>Planificação de cubo, cilindro ou cone<\/td><\/tr><tr><td><b>M16<\/b><\/td><td>Vista superior/frontal e projeção ortogonal de trajetórias<\/td><\/tr><tr><td><b>M17<\/b><\/td><td>Triângulos semelhantes e sombras; Pitágoras em escadas e rampas<\/td><\/tr><tr><td><b>M18<\/b><\/td><td>Área de figuras compostas e contagem de lajotas<\/td><\/tr><tr><td><b>M19<\/b><\/td><td>PFC para senhas e placas; combinação para comissões<\/td><\/tr><tr><td><b>M20<\/b><\/td><td>Probabilidade em tabela de dupla entrada; condicional «dado que»<\/td><\/tr><tr><td><b>M21<\/b><\/td><td>PA em poupanças e empilhamentos<\/td><\/tr><tr><td><b>F01<\/b><\/td><td>Potência/consumo: E = P·Δt, kWh, conta de luz, chuveiro inverno/verão (P = U²/R), LED × incandescente<\/td><\/tr><tr><td><b>F02<\/b><\/td><td>Associação de resistores: brilho de lâmpadas, uma que queima, fusível/disjuntor, instalação em paralelo, bitola do fio<\/td><\/tr><tr><td><b>F03<\/b><\/td><td>Rendimento/eficiência: usinas (hidrelétrica, térmica, eólica, nuclear, solar), conversões de energia, máquina térmica<\/td><\/tr><tr><td><b>F04<\/b><\/td><td>Calorimetria: Q = mcΔT e Q = mL, curva de aquecimento<\/td><\/tr><tr><td><b>F05<\/b><\/td><td>Propagação do calor: garrafa térmica, estufa, brisas, cobertor, panelas<\/td><\/tr><tr><td><b>F06<\/b><\/td><td>Ondas: v = λf, espectro eletromagnético, ressonância, difração, interferência, Doppler, altura/intensidade/timbre, dB<\/td><\/tr><tr><td><b>F07<\/b><\/td><td>Refração/reflexão total: fibra óptica, miragem, arco-íris/dispersão<\/td><\/tr><tr><td><b>F08<\/b><\/td><td>Lentes e visão: miopia, hipermetropia, correção<\/td><\/tr><tr><td><b>F09<\/b><\/td><td>Gráficos de cinemática: velocidade média, tempo de reação e distância de frenagem, Lei Seca<\/td><\/tr><tr><td><b>F10<\/b><\/td><td>Newton/atrito/cinto/airbag (impulso)<\/td><\/tr><tr><td><b>F11<\/b><\/td><td>Hidrostática: Stevin (mergulho, pressão arterial), Pascal (macaco hidráulico), Arquimedes (flutuação), densidade<\/td><\/tr><tr><td><b>F12<\/b><\/td><td>Indução: geradores, transformadores, usinas, cartão magnético, carregador sem fio<\/td><\/tr><tr><td><b>Q01<\/b><\/td><td>Estequiometria industrial e ambiental (massa de CO2 emitida, minério → metal, rendimento)<\/td><\/tr><tr><td><b>Q02<\/b><\/td><td>Concentração (ppm, mg/L, g/L, mol/L) em rótulos, soro e água potável; diluição<\/td><\/tr><tr><td><b>Q03<\/b><\/td><td>Separação de misturas e ETA (coagulação/floculação/decantação/filtração/cloração); destilação do petróleo<\/td><\/tr><tr><td><b>Q04<\/b><\/td><td>Forças intermoleculares → solubilidade, PE/PF, detergentes e micelas, vitaminas/fármacos<\/td><\/tr><tr><td><b>Q05<\/b><\/td><td>pH e ácido-base: calagem do solo, antiácidos, chuva ácida (SO2/NOx), indicadores naturais<\/td><\/tr><tr><td><b>Q06<\/b><\/td><td>Pilhas/baterias/corrosão/metal de sacrifício; eletrólise (galvanoplastia, alumínio)<\/td><\/tr><tr><td><b>Q07<\/b><\/td><td>Cinética: refrigeração de alimentos, catalisadores, enzimas, superfície de contato<\/td><\/tr><tr><td><b>Q08<\/b><\/td><td>Equilíbrio/Le Chatelier: CO2 no refrigerante, tampão do sangue, hemoglobina na altitude, Haber<\/td><\/tr><tr><td><b>Q09<\/b><\/td><td>Funções orgânicas: identificar a função num fármaco/hormônio/agrotóxico<\/td><\/tr><tr><td><b>Q10<\/b><\/td><td>Esterificação/transesterificação/biodiesel; saponificação; polímeros/biodegradáveis/reciclagem<\/td><\/tr><tr><td><b>Q11<\/b><\/td><td>Termoquímica: poder calorífico dos combustíveis, Hess, combustão completa/incompleta (CO)<\/td><\/tr><tr><td><b>Q12<\/b><\/td><td>Radioatividade: meia-vida (C-14, lixo nuclear, medicina nuclear), usinas<\/td><\/tr><tr><td><b>B01<\/b><\/td><td>Desequilíbrio ambiental: eutrofização, bioacumulação, espécies invasoras, desmatamento, queimadas, poluição térmica<\/td><\/tr><tr><td><b>B02<\/b><\/td><td>Ciclos do C/N: fixação biológica, leguminosas/rotação, sequestro de carbono, efeito estufa<\/td><\/tr><tr><td><b>B03<\/b><\/td><td>Cadeias/teias/pirâmides e fluxo de energia (regra dos 10 %)<\/td><\/tr><tr><td><b>B04<\/b><\/td><td>Relações ecológicas (mutualismo, parasitismo, controle biológico) e sucessão<\/td><\/tr><tr><td><b>B05<\/b><\/td><td>Biomas brasileiros (Cerrado, Caatinga, Mata A 27 · PPL 2025"], "controlesTable": "\n<p>Meta de acertos (de 45) em cada controle. Estimativa com as medianas TRI de 2025 (XTRI): é um guia, não uma conversão exata.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Controle<\/th><th>Ling<\/th><th>Hum<\/th><th>Nat<\/th><th>Mat<\/th><th>Red.<\/th><th>Média<\/th><\/tr>\n<tr><td>dez/2026 (ENEM 2026)<\/td><td colspan=\"6\">linha de base: anote o que tirar<\/td><\/tr>\n<tr><td>fev/2027<\/td><td>32<\/td><td>30<\/td><td>19<\/td><td>23<\/td><td>640<\/td><td>~625<\/td><\/tr>\n<tr><td>abr/2027<\/td><td>33<\/td><td>32<\/td><td>22<\/td><td>25<\/td><td>700<\/td><td>~655<\/td><\/tr>\n<tr><td>jun/2027<\/td><td>34<\/td><td>33<\/td><td>24<\/td><td>27<\/td><td>760<\/td><td>~680<\/td><\/tr>\n<tr><td>ago/2027<\/td><td>35<\/td><td>34<\/td><td>26<\/td><td>28<\/td><td>820<\/td><td>~700<\/td><\/tr>\n<tr><td>out/2027<\/td><td>35–37<\/td><td>35–36<\/td><td>28–30<\/td><td>29–31<\/td><td>880+<\/td><td><b>~720–740<\/b><\/td><\/tr>\n<\/table><\/div>\n<p class=\"small\">Se dois controles seguidos ficarem mais de 20 pontos abaixo da meta, mude quais áreas prioriza, não o método.<\/p>\n", "cobertura": "\n<style>.cov{margin:.5rem 0;border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;background:var(--card)}.cov summary{cursor:pointer}.cov table td:last-child{white-space:nowrap}<\/style>\n<div class=\"box\"><b>Resultado da auditoria (out/2026).<\/b> Conferi o cronograma contra a Matriz de Referência do ENEM (os «objetos de conhecimento» das 4 áreas) e contra as questões de 2009 a 2025. O cronograma anterior deixava de fora ou cortava cerca de 30 temas. Agora:\n<ul>\n<li><b>Nenhum objeto de conhecimento da Matriz fica sem bloco.<\/b> 323 temas e focos com bloco próprio, mais 71 subitens dentro de temas vizinhos.<\/li>\n<li><b>21 sessões novas<\/b>: Genética II (2ª Lei, linkage, síndromes), Evolução III (origem da vida, Hardy-Weinberg), Embriologia, Sistemática e cladogramas, Saúde pública e indicadores, Conservação e unidades de conservação; Ciclo trigonométrico, Simetria e transformações, Funções polinomiais/racionais e sistemas lineares; Astronomia e cosmologia, Oscilações (MHS); Curvas de solubilidade e Kps, Termoquímica II (Hess), Indústria química e siderurgia; História da África e diáspora, Antropologia, Racismo estrutural e gênero, Filosofia política, Música/teatro/dança, História da arte e patrimônio, Gêneros literários e Espanhol.<\/li>\n<li><b>Temas que eram excluídos e voltaram<\/b>: Literatura colonial, Parnasianismo e Simbolismo, Poesia concreta e canção, Transportes e redes, IDH e Gini, Kant e Hegel, Invasões estrangeiras, Marx e Nietzsche.<\/li>\n<li><b>Linguagens<\/b>: as listas agora passam por 27 focos (antes 17), incluindo intertextualidade, argumentação, gramática em contexto, Educação Física, arte e Espanhol.<\/li>\n<li><b>Fora da Matriz, de propósito<\/b>: números complexos e compostos de coordenação (não aparecem na Matriz nem em questões recentes).<\/li>\n<\/ul><\/div>\n<h2>Onde está cada tema<\/h2>\n<p class=\"small\">Toque numa disciplina para ver os temas e a semana em que cada um aparece. Os temas da Fase 0 contam como revisão rápida.<\/p>\n<details class=\"cov\"><summary><b>Matemática<\/b> · 67 temas<\/summary><div class=\"tw\"><table><tr><th>Tema<\/th><th>Semana(s)<\/th><\/tr><tr><td>Operações, frações, decimais e dízimas em problemas<\/td><td>S1<\/td><\/tr><tr><td>Funções afim e quadrática como gráfico<\/td><td>S1<\/td><\/tr><tr><td>Potências de 10, notação científica e logaritmo decimal<\/td><td>S1<\/td><\/tr><tr><td>Trigonometria no triângulo retângulo e decomposição de vetores<\/td><td>S2<\/td><\/tr><tr><td>Equações e sistemas de 1º e 2º grau em problemas<\/td><td>S2<\/td><\/tr><tr><td>Razão e proporção, MMC e MDC em problemas<\/td><td>S3<\/td><\/tr><tr><td>Potenciação, radiciação e produtos notáveis<\/td><td>S3<\/td><\/tr><tr><td>Regra de três simples: grandezas diretas e inversas<\/td><td>S4<\/td><\/tr><tr><td>Escala: mapas e plantas<\/td><td>S4<\/td><\/tr><tr><td>Porcen <script>
(function () {
  "use strict";
  const PLAN = JSON.parse(document.getElementById("plan-data").textContent);
  const DIAS = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
  const LS_KEY = "enem2027-estado-v1";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>';

  // ---------- state: localStorage first (works offline), mirrored to the per-viewer db doc ----------
  let state = { checks: {}, registro: {}, controles: {}, updated: 0 };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  let dbDoc = null, syncMsg = "Salvo neste celular", pending = null, writing = false;
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function schedulePush() {
    state.updated = Date.now(); saveLocal();
    if (!dbDoc) return;
    clearTimeout(pending); pending = setTimeout(push, 900);
  }
  async function push() {
    if (!dbDoc || writing) { if (dbDoc) pending = setTimeout(push, 900); return; }
    writing = true;
    try { await dbDoc.set({ checks: state.checks, registro: state.registro, controles: state.controles, updated: state.updated }); syncMsg = "Sincronizado na sua conta"; }
    catch (e) { syncMsg = navigator.onLine === false ? "Sem internet: salvo no celular, sincroniza depois" : "Salvo no celular (sincronização indisponível)"; }
    writing = false; updateSync();
  }
  function updateSync() { document.querySelectorAll("[data-sync]").forEach((n) => (n.textContent = syncMsg)); }
  window.addEventListener("online", () => { if (dbDoc) push(); });
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      dbDoc = db.doc("data/users/" + uid + "/estado");
      const snap = await dbDoc.get();
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updated || 0) > (state.updated || 0)) {
          state = Object.assign({ checks: {}, registro: {}, controles: {} }, JSON.parse(JSON.stringify(remote)));
          saveLocal(); render();
        } else if ((state.updated || 0) > (remote.updated || 0)) { push(); }
        syncMsg = "Sincronizado na sua conta";
      } else if (state.updated) { push(); }
      updateSync();
    } catch (e) { /* stays local */ }
  })();

  // ---------- dates ----------

  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const br = (s) => { const d = parse(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); };
  const DAYS = []; const DAYIDX = {};
  PLAN.weeks.forEach((w, wi) => w.days.forEach((d) => { DAYIDX[d.date] = DAYS.length; DAYS.push({ wi, d }); }));
  function todayIso() {
    const t = iso(new Date());
    if (DAYIDX[t] !== undefined) return t;
    return t < DAYS[0].d.date ? DAYS[0].d.date : DAYS[DAYS.length - 1].d.date;
  }
  let cur = todayIso();
  let weekSel = DAYS[DAYIDX[cur]].wi;

  // ---------- helpers ----------
  const key = (date, i) => date + "#" + i;
  function blockHtml(day, b, i) {
    const k = key(day.date, i), done = !!state.checks[k];
    const T = b.plant && PLAN.templates[b.plant];
    let steps = "";
    if (T) {
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const isToday = day.date === iso(new Date());
      steps = '<details class="steps"' + (isToday && T.steps.some((s) => inStep(s, nowMin)) ? " open" : "") + '><summary>O que fazer, minuto a minuto (' + esc(b.plant) + ")</summary>" +
        T.steps.map((s) => '<div class="step' + (isToday && inStep(s, nowMin) ? " now" : "") + '"><div><div class="tm">' + s[0] + "–" + s[1] + '</div><span class="wifi ' + (s[2] ? "on" : "off") + '">' + (s[2] ? "COM WIFI" : "SEM WIFI") + "</span></div><div>" + esc(s[3]) +
          '<div class="det"><b>Material:</b> ' + esc(s[4]) + " · <b>Resultado:</b> " + esc(s[5]) + " · <b>Confira:</b> " + esc(s[6]) + "</div></div></div>").join("") + "</details>";
    }
    const tema = b.tema ? '<div class="tema">«' + esc(b.tema) + '»</div><button class="copy" data-copy="' + esc(b.tema) + '">Copiar tema</button>' : '<div class="tema">' + esc(b.title) + "</div>";
    const pre = b.tema && b.label ? '<div class="meta"><b>' + esc(b.label) + "</b></div>" : "";
    return '<div class="blk' + (done ? " done" : "") + '"><div class="bh"><button class="check" aria-label="Marcar como feito" aria-pressed="' + done + '" data-k="' + k + '">' + CHECK + '</button><div class="grow">' +
      '<div class="meta"><b>' + esc(b.time) + " " + esc(b.code) + "</b> · " + esc(b.subj) + (b.hint ? " · " + esc(b.hint) : "") + "</div>" + pre + tema +
      (b.sub ? '<div class="sub"><b>' + esc(b.subLabel || "subtemas") + ":</b> " + esc(b.sub) + "</div>" : "") +
      (b.pad ? '<div class="sub"><b>padrões:</b> ' + esc(b.pad) + "</div>" : "") +
      (b.src ? '<div class="sub small">' + esc(b.src) + "</div>" : "") +
      (b.extra ? '<div class="sub small">' + esc(b.extra) + "</div>" : "") + steps + "</div></div></div>";
  }
  function inStep(s, m) { const a = toMin(s[0]), b = toMin(s[1]); return m >= a && m < b; }
  function toMin(h) { const [a, b] = h.split(":").map(Number); return a * 60 + b; }
  function prepHtml(day, which, label, text) {
    const k = day.date + "#" + which, done = !!state.checks[k];
    return '<div class="prep' + (done ? " done" : "") + '"><button class="check" aria-label="Marcar como salvo" aria-pressed="' + done + '" data-k="' + k + '">' + CHECK + '</button><div><b>' + esc(label) + "</b>" + esc(text) + "</div></div>";
  }
  function dayCard(day) {
    const wd = (parse(day.date).getDay() + 6) % 7;
    let h = '<section class="day" style="background:var(--s' + wd + ')"><div class="dh" style="background:var(--d' + wd + ')">' + DIAS[wd] + "<span>" + br(day.date) + (day.holiday ? " · feriado: " + esc(day.holiday) : "") + "</span></div>";
    day.blocks.forEach((b, i) => (h += blockHtml(day, b, i)));
    if (day.note) h += '<div class="note">' + esc(day.note) + "</div>";
    if (day.prepPm) h += prepHtml(day, "pm", "Salvar 13:15 → para a tarde", day.prepPm);
    if (day.prepNext) h += prepHtml(day, "next", "Salvar " + day.prepNextAt + " → para " + day.prepNext[0], day.prepNext[1]);
    return h + "</section>";
  }
  function weekProgress(w) {
    let tot = 0, ok = 0;
    w.days.forEach((d) => d.blocks.forEach((b, i) => { if (b.code !== "—") { tot++; if (state.checks[key(d.date, i)]) ok++; } }));
    return [ok, tot];
  }
  function nowBanner(day) {
    if (day.date !== iso(new Date())) return "";
    const m = new Date().getHours() * 60 + new Date().getMinutes();
    let msg = "", sub = "";
    if (m < 720) { msg = "Próximo bloco: 12:00 (sem wifi até 12:30)"; sub = "Confira se o material do pré-teste está salvo no celular."; }
    else if (m < 750) { msg = "Agora: 12:00–12:30 · SEM WIFI"; sub = "Use só o que está salvo: prints, Notas, caderno."; }
    else if (m < 810) { msg = "Agora: 12:30–13:30 · COM WIFI"; sub = "IA, prática e, às 13:15, salvar o material da tarde."; }
    else if (m < 1050) { msg = "Próximo bloco: 17:30 (sem wifi até 18:25)"; sub = "O material da tarde já está salvo?"; }
    else if (m < 1105) { msg = "Agora: 17:30–18:25 · SEM WIFI"; sub = "Cartões, espiral e material salvo."; }
    else if (m < 1140) { msg = "Agora: 18:25–19:00 · COM WIFI"; sub = "Corrigir e, às 18:45, salvar o material de amanhã."; }
    else { msg = "Blocos de hoje encerrados"; sub = "Marque o que fez e durma bem."; }
    return '<div class="now-banner">' + msg + "<small>" + sub + "</small></div>";
  }

  // ---------- views ----------
  function viewHoje() {
    const { wi, d } = DAYS[DAYIDX[cur]];
    const w = PLAN.weeks[wi];
    const [ok, tot] = weekProgress(w);
    const isToday = cur === iso(new Date());
    let h = '<header class="top"><div class="row"><button class="navbtn" data-go="-1" aria-label="Dia anterior">‹</button><div class="grow"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">Semana ' + w.n + " · " + esc(w.kind) + "</div><h1>" + (isToday ? "Hoje" : DIAS[(parse(cur).getDay() + 6) % 7]) + "</h1></div>" +
      (isToday ? "" : '<button class="navbtn wide" data-today>Hoje</button>') + '<button class="navbtn" data-go="1" aria-label="Próximo dia">›</button></div>' +
      '<div class="chips"><span class="chip">' + br(cur) + '</span><span class="chip">' + esc(w.phase) + '</span><span class="chip">' + ok + "/" + tot + ' blocos na semana</span></div><div class="progressbar"><i style="width:' + (tot ? Math.round((100 * ok) / tot) : 0) + '%"></i></div></header>';
    h += nowBanner(d);
    if (w.decision && parse(cur).getDay() === 1) h += w.decision;
    if (w.milestone) h += '<div class="hito"><b>Marco:</b> ' + esc(w.milestone) + "</div>";
    h += dayCard(d);
    if (w.spiral) h += '<div class="spiral"><b>Espiral da semana</b> (5 questões destes temas às 17:45–18:00): ' + esc(w.spiral) + "</div>";
    h += '<p class="sync" data-sync>' + esc(syncMsg) + "</p>";
    return h;
  }
  function viewSemana() {
    const w = PLAN.weeks[weekSel];
    const [ok, tot] = weekProgress(w);
    let h = '<header class="top"><div class="row"><button class="navbtn" data-week="-1" aria-label="Semana anterior">‹</button><div class="grow"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">' + esc(w.range) + " · " + esc(w.kind) + "</div><h1>Semana " + w.n + '</h1></div><button class="navbtn" data-week="1" aria-label="Próxima semana">›</button></div><div class="chips"><span class="chip">' + esc(w.phase) + '</span><span class="chip">' + ok + "/" + tot + " blocos</span></div></header>";
    if (w.decision) h += w.decision;
    if (w.milestone) h += '<div class="hito"><b>Marco:</b> ' + esc(w.milestone) + "</div>";
    if (w.spiral) h += '<div class="spiral"><b>Espiral da semana:</b> ' + esc(w.spiral) + "</div>";
    w.days.forEach((d) => (h += dayCard(d)));
    h += "<h2>Ir para uma semana</h2><div class=\"weekgrid\">" + PLAN.weeks.map((x, i) => {
      const [a, t] = weekProgress(x);
      return '<button data-pick="' + i + '" class="' + (i === weekSel ? "cur" : "") + '" style="background:var(--d' + x.color + ')"><b>S' + x.n + "</b>" + esc(x.range.split("–")[0]) + "<br>" + a + "/" + t + "</button>";
    }).join("") + "</div>";
    return h;
  }
  function viewRotinas() {
    let h = '<header class="top"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">12:00–13:30 e 17:30–19:00</div><h1>Rotinas dos blocos</h1></header>' +
      '<p class="small" style="margin-top:.7rem">Cada bloco do cronograma tem um código (P1, P2…). Aqui está o que fazer em cada trecho, com material, wifi, resultado e como conferir.</p>' + PLAN.semanaTipo;
    PLAN.templateOrder.forEach((k) => {
      const T = PLAN.templates[k];
      h += '<section class="box" id="tpl-' + k + '"><h3>' + k + " · " + esc(T.name) + '</h3><div class="small">' + esc(T.when) + "</div>" +
        T.steps.map((s) => '<div class="step"><div><div class="tm">' + s[0] + "–" + s[1] + '</div><span class="wifi ' + (s[2] ? "on" : "off") + '">' + (s[2] ? "COM WIFI" : "SEM WIFI") + "</span></div><div>" + esc(s[3]) + '<div class="det"><b>Material:</b> ' + esc(s[4]) + " · <b>Resultado:</b> " + esc(s[5]) + " · <b>Confira:</b> " + esc(s[6]) + "</div></div></div>").join("") + "</section>";
    });
    return h;
  }
  function viewPrompts() {
    let h = '<header class="top"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">Use sempre num trecho COM WIFI</div><h1>Prompts</h1></header><p class="small" style="margin-top:.7rem">Troque só o que está [ENTRE COLCHETES]. O botão copia o texto inteiro.</p>';
    PLAN.prompts.forEach((p) => {
      h += '<section class="box"><h3>Prompt ' + p[0] + " · " + esc(p[1]) + '</h3><button class="copy" data-copy="' + esc(p[2]) + '">Copiar prompt</button><pre class="code">' + esc(p[2]) + "</pre></section>";
    });
    h += '<p class="small">Por que a IA só dá dicas: num estudo com alunos do ensino médio, usar o ChatGPT sem limites subiu 48 % a nota da prática, mas baixou 17 % a da prova sem ajuda; um tutor que só dava dicas não teve esse efeito (Bastani et al., 2024).</p>';
    return h;
  }
  function viewGuia() {
    let h = '<header class="top"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">Estratégia, técnicas e plano B</div><h1>Guia</h1></header><div class="list" style="margin-top:.8rem">' +
      PLAN.sections.map((s) => '<a class="item" href="#guia-' + s[0] + '"><span>' + esc(s[1]) + "</span><span>›</span></a>").join("") +
      '<a class="item" href="#guia-cobertura"><span>Mapa de cobertura do conteúdo</span><span>›</span></a>' +
      '<a class="item" href="#guia-padroes"><span>Padrões: os tipos de questão que o ENEM repete</span><span>›</span></a>' +
      '<a class="item" href="#progresso"><span>Progresso, registro semanal e controles</span><span>›</span></a>' +
      '<a class="item" href="#guia-fontes"><span>Fontes</span><span>›</span></a></div>' +
      '';
    return h;
  }
  function viewSection(id) {
    const s = PLAN.sections.find((x) => x[0] === id);
    let title = s ? s[1] : "", body = s ? s[2] : "";
    if (id === "padroes") { title = "Padrões ENEM"; body = PLAN.padroes; }
    if (id === "cobertura") { title = "Mapa de cobertura"; body = PLAN.cobertura; }
    if (id === "fontes") { title = "Fontes"; body = '<p class="small">Evidência = estudos; Dados/Oficial = fontes de números; Estimativa = cálculo a partir de dados.</p><div class="list">' + PLAN.fontes.map((f) => '<a class="item" href="' + esc(f[2]) + '" target="_blank" rel="noopener"><span><span class="small">' + esc(f[0]) + "</span><br>" + esc(f[1]) + "</span><span>↗</span></a>").join("") + "</div>"; }
    return '<header class="top"><div class="row"><a class="navbtn" href="#guia" aria-label="Voltar ao guia">‹</a><div class="grow"><div class="eyebrow">Guia</div><h1>' + esc(title) + '</h1></div></div></header><div style="margin-top:.8rem">' + body + "</div>";
  }
  function viewProgresso() {
    let tot = 0, ok = 0;
    PLAN.weeks.forEach((w) => { const [a, t] = weekProgress(w); ok += a; tot += t; });
    const past = DAYS.filter((x) => x.d.date <= iso(new Date()));
    let ptot = 0, pok = 0;
    past.forEach(({ d }) => d.blocks.forEach((b, i) => { if (b.code !== "—") { ptot++; if (state.checks[key(d.date, i)]) pok++; } }));
    const w = PLAN.weeks[DAYS[DAYIDX[todayIso()]].wi];
    const reg = state.registro["C" + w.n] || {};
    const fields = [["blocos", "Blocos feitos (de 12)"], ["sono", "Sono médio (h)"], ["mat", "Acerto Mat (%)"], ["nat", "Acerto Nat (%)"], ["hum", "Acerto Hum (%)"], ["ling", "Acerto Ling (%)"], ["seguro", "«Seguro mas errei» na semana"], ["redacao", "Redação: nota estimada"]];
    let h = '<header class="top"><div class="eyebrow"><img src="favicon-32x32.png" alt="Icon" class="hdr-icon">Registro e controles</div><h1>Progresso</h1></header>' +
      '<div class="kpis"><div class="kpi"><span>' + pok + "/" + ptot + '</span>blocos até hoje</div><div class="kpi hi"><span>' + (ptot ? Math.round((100 * pok) / ptot) : 0) + '%</span>constância</div><div class="kpi"><span>' + ok + '</span>de ' + tot + " no plano</div></div>" +
      '<h2>Registro semanal · Semana ' + w.n + '</h2><p class="small">Preencha no sábado às 18:45 (2 minutos). Fica salvo no celular e na sua conta.</p><form id="reg"><div class="grid2">' +
      fields.map((f) => '<div><label class="f" for="r-' + f[0] + '">' + f[1] + '</label><input class="f" inputmode="decimal" id="r-' + f[0] + '" name="' + f[0] + '" value="' + esc(reg[f[0]] || "") + '"></div>').join("") +
      '</div><label class="f" for="r-tema">Tema que mais errei</label><input class="f" id="r-tema" name="tema" value="' + esc(reg.tema || "") + '"><label class="f" for="r-animo">Ânimo (1–5) e observações</label><textarea class="f" id="r-animo" name="animo">' + esc(reg.animo || "") + '</textarea><button class="btn" type="submit">Salvar registro</button> <span class="sync" data-sync>' + esc(syncMsg) + "</span></form>";
    h += "<h2>Controles</h2>" + PLAN.controlesTable + '<form id="ctl"><div class="tw"><table><tr><th>Controle</th><th>Ling</th><th>Hum</th><th>Nat</th><th>Mat</th><th>Red.</th></tr>' +
      PLAN.controles.map((c) => "<tr><td>" + esc(c) + "</td>" + ["ling", "hum", "nat", "mat", "red"].map((a) => '<td><input class="f" style="min-width:3.2rem;padding:.3rem" inputmode="numeric" aria-label="' + esc(c + " " + a) + '" id="c-' + esc(c.replace(/\W/g, "")) + "-" + a + '" name="' + esc(c) + "|" + a + '" value="' + esc((state.controles[c] || {})[a] || "") + '"></td>').join("") + "</tr>").join("") +
      '</table></div><button class="btn" type="submit">Salvar controles</button></form>';
    h += "<h2>Registros anteriores</h2>" + (Object.keys(state.registro).length ? '<div class="tw"><table><tr><th>Semana</th><th>Blocos</th><th>Sono</th><th>Mat</th><th>Nat</th><th>Hum</th><th>Ling</th><th>Red.</th></tr>' +
      Object.keys(state.registro).sort((a, b) => +a.slice(1) - +b.slice(1)).map((k) => { const r = state.registro[k]; return "<tr><td>" + k + "</td>" + ["blocos", "sono", "mat", "nat", "hum", "ling", "redacao"].map((f) => "<td>" + esc(r[f] || "") + "</td>").join("") + "</tr>"; }).join("") + "</table></div>" : '<p class="small">Ainda não há registros. O primeiro é no sábado.</p>');
    return h;
  }

  // ---------- router ----------
  function route() {
    const h = (location.hash || "#hoje").slice(1);
    let v = h, html;
    if (h === "hoje" || !h) html = viewHoje();
    else if (h === "semana") html = viewSemana();
    else if (h === "rotinas") html = viewRotinas();
    else if (h === "prompts") html = viewPrompts();
    else if (h === "guia") html = viewGuia();
    else if (h === "progresso") { html = viewProgresso(); v = "guia"; }
    else if (h.startsWith("guia-")) { html = viewSection(h.slice(5)); v = "guia"; }
    else { html = viewHoje(); v = "hoje"; }
    app.innerHTML = html;
    document.querySelectorAll(".tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === v ? "page" : "false"));
  }
  function render() { const y = window.scrollY; route(); window.scrollTo(0, y); }
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

  app.addEventListener("click", (ev) => {
    const t = ev.target.closest("button, a");
    if (!t) return;
    if (t.dataset.k) { const k = t.dataset.k; if (state.checks[k]) delete state.checks[k]; else state.checks[k] = 1; schedulePush(); render(); return; }
    if (t.dataset.go) { const i = Math.min(DAYS.length - 1, Math.max(0, DAYIDX[cur] + +t.dataset.go)); cur = DAYS[i].d.date; weekSel = DAYS[i].wi; route(); return; }
    if (t.hasAttribute("data-today")) { cur = todayIso(); weekSel = DAYS[DAYIDX[cur]].wi; route(); return; }
    if (t.dataset.week) { weekSel = Math.min(PLAN.weeks.length - 1, Math.max(0, weekSel + +t.dataset.week)); route(); window.scrollTo(0, 0); return; }
    if (t.dataset.pick) { weekSel = +t.dataset.pick; route(); window.scrollTo(0, 0); return; }
    if (t.dataset.copy !== undefined) {
      const txt = t.dataset.copy, old = t.textContent;
      const done = () => { t.textContent = "Copiado"; setTimeout(() => (t.textContent = old), 1400); };
      try { navigator.clipboard.writeText(txt).then(done, () => selectFallback(t)); } catch (e) { selectFallback(t); }
    }
  });
  function selectFallback(btn) {
    const pre = btn.parentElement.querySelector("pre, .tema");
    if (!pre) return;
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "Texto selecionado: toque em Copiar";
  }
  app.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = ev.target, fd = new FormData(f);
    if (f.id === "reg") {
      const w = PLAN.weeks[DAYS[DAYIDX[todayIso()]].wi];
      const r = {}; fd.forEach((v, k) => (r[k] = String(v).slice(0, 400)));
      state.registro["C" + w.n] = r;
    } else if (f.id === "ctl") {
      fd.forEach((v, k) => { const [c, a] = k.split("|"); state.controles[c] = state.controles[c] || {}; state.controles[c][a] = String(v).slice(0, 8); });
    }
    schedulePush(); render();
    const b = document.querySelector("#" + f.id + " .btn"); if (b) { b.textContent = "Salvo"; }
  });
  route();
  let lastDay = iso(new Date());
  function rollDay() { const t = iso(new Date()); if (t !== lastDay) { if (cur === todayIsoFor(lastDay)) { cur = todayIso(); weekSel = DAYS[DAYIDX[cur]].wi; } lastDay = t; } }
  function todayIsoFor(t) { if (DAYIDX[t] !== undefined) return t; return t < DAYS[0].d.date ? DAYS[0].d.date : DAYS[DAYS.length - 1].d.date; }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { rollDay(); if ((location.hash || "#hoje") === "#hoje") render(); } });
  setInterval(() => { rollDay(); if ((location.hash || "#hoje") === "#hoje") render(); }, 60000);
})();
</script>

</body></html>
